<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Novo portfólio em construção — Volte em breve</title>
    <style>
      :root {
        --bg1: #0f172a; /* slate-900 */
        --bg2: #1e293b; /* slate-800 */
        --accent1: #22d3ee; /* cyan-400 */
        --accent2: #6366f1; /* indigo-500 */
        --accent3: #f472b6; /* pink-400 */
        --text: #e2e8f0; /* slate-200 */
        --muted: #94a3b8; /* slate-400 */
        --glass: rgba(2, 6, 23, 0.45);
        --border: rgba(148, 163, 184, 0.25);
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        font-weight: 400;
        font-style: normal;
        color: var(--text);
        background: radial-gradient(
            1200px 800px at 10% 10%,
            rgba(99, 102, 241, 0.15),
            rgba(0, 0, 0, 0) 40%
          ),
          radial-gradient(
            1000px 700px at 90% 90%,
            rgba(34, 211, 238, 0.12),
            rgba(0, 0, 0, 0) 40%
          ),
          linear-gradient(120deg, var(--bg1), var(--bg2));
        overflow: hidden;
      }

      /* Animated gradient veil */
      .bg-veil {
        position: fixed;
        inset: -50% -50%;
        background: conic-gradient(
          from 0deg,
          var(--accent1),
          var(--accent2),
          var(--accent3),
          var(--accent2),
          var(--accent1)
        );
        filter: blur(120px) saturate(120%);
        opacity: 0.18;
        animation: spin 24s linear infinite;
        will-change: transform;
        pointer-events: none;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      .wrap {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        isolation: isolate;
      }

      .card {
        width: min(720px, 92vw);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.02)
        );
        backdrop-filter: blur(14px) saturate(130%);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 60px var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        padding: clamp(1.25rem, 3vw, 2rem);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(2, 6, 23, 0.55);
        font-size: 0.9rem;
        color: var(--muted);
      }

      .icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent1), var(--accent2));
        color: #0b1020;
        box-shadow: 0 6px 18px rgba(34, 211, 238, 0.35);
        animation: float 3.6s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      h1 {
        margin: 0.9rem 0 0.4rem;
        font-size: clamp(1.8rem, 4vw, 3rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        background: linear-gradient(90deg, var(--text), #fff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 1px 20px rgba(255, 255, 255, 0.05);
      }

      .subtitle {
        font-size: clamp(1rem, 2.2vw, 1.25rem);
        color: var(--muted);
      }

      .shimmer {
        position: relative;
        display: inline-block;
        background: linear-gradient(
          110deg,
          rgba(255, 255, 255, 0.08) 20%,
          rgba(255, 255, 255, 0.6) 35%,
          rgba(255, 255, 255, 0.08) 50%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2.2s ease-in-out infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .progress {
        margin-top: 1.25rem;
        height: 10px;
        width: 100%;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(148, 163, 184, 0.12);
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: repeating-linear-gradient(
          45deg,
          var(--accent2) 0 14px,
          var(--accent1) 14px 28px
        );
        animation: load 6s ease-in-out infinite;
      }
      @keyframes load {
        0% {
          width: 0%;
        }
        50% {
          width: 72%;
        }
        100% {
          width: 100%;
        }
      }

      .footer {
        margin-top: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .links {
        display: inline-flex;
        gap: 0.75rem;
      }
      .link {
        color: var(--text);
        text-underline-offset: 4px;
        opacity: 0.8;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .link:hover {
        opacity: 1;
        transform: translateY(-1px);
      }

      /* Subtle entrance animation */
      .reveal {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        animation: in 0.8s ease forwards;
      }
      .reveal-2 {
        animation-delay: 0.1s;
      }
      .reveal-3 {
        animation-delay: 0.2s;
      }
      @keyframes in {
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Responsive tweak for very small screens */
      @media (max-width: 360px) {
        .chip {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-veil" aria-hidden="true"></div>
    <main class="wrap" role="main">
      <section class="card" aria-labelledby="titulo">
        <div class="chip reveal" aria-live="polite">
          <span class="icon" aria-hidden="true">🔧</span>
          <span>Em construção</span>
        </div>
        <h1 id="titulo" class="reveal reveal-2">
          Novo portfólio em construção
        </h1>
        <p class="subtitle reveal reveal-3">
          <span class="shimmer">Volte em breve</span> — estamos preparando algo
          especial.
        </p>
        <div
          class="progress reveal reveal-3"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="72"
          aria-label="Progresso de construção"
        >
          <div class="bar"></div>
        </div>
        <div
          class="footer reveal reveal-3"
          aria-label="Informações complementares"
        >
          <span>Obrigado pela visita.</span>
          <div class="links">
            <a
              class="link"
              href="#"
              onclick="window.history.back(); return false;"
              aria-label="Voltar"
              >Voltar</a
            >
            <span>•</span>
            <a
              class="link"
              href="mailto:contato@alessao.com.br"
              aria-label="Entre em contato por e-mail"
              >Contato</a
            >
          </div>
        </div>
      </section>
    </main>

    <script>
      // Optional easter-egg: sparkle on click
      const root = document.documentElement;
      document.addEventListener("click", (e) => {
        const spark = document.createElement("span");
        spark.textContent = "✨";
        spark.style.position = "fixed";
        spark.style.left = e.clientX + "px";
        spark.style.top = e.clientY + "px";
        spark.style.pointerEvents = "none";
        spark.style.userSelect = "none";
        spark.style.transform = "translate(-50%, -50%) scale(0.8)";
        spark.style.filter = "drop-shadow(0 6px 12px rgba(255,255,255,.35))";
        spark.style.transition = "all .8s ease";
        document.body.appendChild(spark);
        requestAnimationFrame(() => {
          spark.style.transform = "translate(-50%, -120%) scale(1.3)";
          spark.style.opacity = "0";
        });
        setTimeout(() => spark.remove(), 900);
      });
    </script>
  </body>
</html>
